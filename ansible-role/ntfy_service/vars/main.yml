---
ntfy_service_base_url: >-
  {{ ('https://' ~ ntfy_service_hostname) if ntfy_service_hostname | length > 0
     else ('http://127.0.0.1:' ~ service_port) }}

ntfy_service_config_defaults:
  NTFY_BEHIND_PROXY: true
  NTFY_CACHE_DURATION: 72h

ntfy_service_memory_defaults:
  server: 128M

ntfy_service_access: >-
  {% for name, user in ntfy_service_users.items() %}{% for topic, right in
  (user.access | default({})).items() %}{{ name }}:{{ topic }}:{{ right }},{% endfor %}{% endfor %}

quadlet_service_required:
  service_port: '^[0-9]+$'
# A salt from the name keeps the hash the same between runs.
quadlet_service_secrets:
  ntfy_service_auth_users: >-
    {% for name, user in ntfy_service_users.items() %}{% set secret = user.password | default(user.token) %}{{ name }}:{{ secret | password_hash('bcrypt',
    salt=(name | hash('sha256'))[:22], ident='2b') }}:user{{ '' if loop.last else ',' }}{% endfor %}
  ntfy_service_auth_tokens: >-
    {% for name, user in ntfy_service_users.items() if user.token is defined %}{{ name }}:{{ user.token }}{{ '' if loop.last else ',' }}{% endfor %}
quadlet_service_memory: "{{ ntfy_service_memory_defaults | combine(ntfy_service_memory) }}"
